[versions]
agp = "9.3.3"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
libadb = "3.1.1"
hiddenapibypass = "6.2"
